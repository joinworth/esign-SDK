name: Release draft

# On every merged PR: compute the next version and open a draft release for it.
# The draft's tag is created when the release is published (the app loads
# esign-sdk.js off the tag via jsDelivr, so publishing the draft is what ships it).
#
# Bump size comes from the PR's labels: `major`, `minor`, otherwise `patch`.
# The next version is computed from the highest known version across tags/releases/package.json.

on:
  pull_request:
    types: [closed]
    branches: [main]

# Serialize runs so two quick merges cannot compute the same version.
concurrency:
  group: release-draft
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release-draft:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # full history and tags, needed to find the latest version

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compute next version
        id: version
        run: |
          if echo "$PR_LABELS" | jq -e 'index("major")' >/dev/null; then BUMP=major
          elif echo "$PR_LABELS" | jq -e 'index("minor")' >/dev/null; then BUMP=minor
          else BUMP=patch
          fi

          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          # Include existing release tags (including drafts) so merges that happen before a
          # draft is published still compute a fresh version.
          PKG=$(node -p "require('./package.json').version")
          LATEST_RELEASE=$(gh release list --limit 200 --json tagName --jq '.[].tagName' | sed -n 's/^v//p' | sort -V | tail -n 1)
          LATEST=$(printf '%s\n%s\n%s\n' "${LATEST_TAG#v}" "$LATEST_RELEASE" "$PKG" | sed '/^$/d' | sort -V | tail -n 1)

          IFS=. read -r MAJOR MINOR PATCH <<< "$LATEST"
          case "$BUMP" in
            major) NEXT="$((MAJOR + 1)).0.0" ;;
            minor) NEXT="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) NEXT="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "Bumping $LATEST -> $NEXT ($BUMP, PR #$PR_NUMBER)"
          echo "previous_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        run: |
          NEXT="${{ steps.version.outputs.next }}"
          PREV="${{ steps.version.outputs.previous_tag }}"
          ARGS=()
          if [ -n "$PREV" ]; then ARGS+=(--notes-start-tag "$PREV"); fi
          gh release create "v$NEXT" \
            --draft \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --title "v$NEXT" \
            --generate-notes \
            "${ARGS[@]}"
